<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唄一覧</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 22px; margin-bottom: 16px; border-bottom: 2px solid #333; padding-bottom: 8px; }
    
    /* 唄選択ドロップダウンのスタイル */
    .selector-container {
      margin-bottom: 20px;
    }
    .category-select {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      background-color: #21262d;
      color: #ffffff;
      border: 1px solid #30363d;
      border-radius: 6px;
      outline: none;
    }
    .category-select:focus {
      border-color: #58a6ff;
    }

    .song-list { list-style: none; padding: 0; margin: 0; }
    .song-item {
      padding: 14px;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
    }
    .song-item:active { background-color: #222; }
    .song-title { font-size: 18px; font-weight: bold; color: #58a6ff; }
    .song-subtitle { font-size: 13px; color: #8b949e; margin-top: 4px; }
    .back-button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #58a6ff;
      font-size: 15px;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .lyrics { font-size: 17px; line-height: 1.8; white-space: pre-wrap; margin-top: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="list-view">
    <h1 id="page-title">数え唄 一覧</h1>
    
    <!-- 唄選択メニュー -->
    <div class="selector-container">
      <select id="category-select" class="category-select" onchange="changeCategory()">
        <option value="kazoe">数え唄</option>
        <option value="2025">2025年唄</option>
        <option value="2026">2026年唄</option>
        <option value="sanbyoshi">三拍子</option>
      </select>
    </div>

    <ul class="song-list" id="song-container"></ul>
  </div>

  <div id="detail-view" class="hidden">
    <button class="back-button" onclick="showList()">＜ 唄一覧に戻る</button>
    <h1 id="detail-title"></h1>
    <div id="detail-subtitle" style="color: #8b949e; margin-top: -10px; margin-bottom: 16px;"></div>
    <div class="lyrics" id="detail-lyrics"></div>
  </div>

  <script>
    // ★歌詞データ★
    const songs = [
      // --- 数え唄 ---
      {
        category: "kazoe",
        title: "数え唄",
        subtitle: "一節心を込めまして",
        lyrics: `一節心を込めまして  
唄ってみましょう数え歌

二親ばかりか兄弟も  
あの日を限りに捨てました

短い命を惜しみなく  
生きたいように生きて死ぬ

宜しく頼むと死んでった  
兄貴の顔が目に浮かぶ

いろはにほへとの理屈より  
身体を張りましょ男なら

虫けら呼ばわりされたって  
辞められません秋祭り

涙を噛んでる忍んでる
堪忍袋は誰が切る

やる時ゃ真っ先おれがやる  
その後の責めもおれが負う

今夜も星降れ涙降れ  
恋しや河内の秋祭り
とうとうここまで数え唄  
その名も〇〇数え唄
        （番長）`
      },

      // --- 2025年唄 ---
      {
        category: "2025",
        title: "0.飲むっきゃないね",
        subtitle: "神社–歌い回し",
        lyrics: `1.祭り男につかまった  
(あーどっこい)
嘘はとっくにお見通し  
(あーどっこい)
祭りバカだと  叩いても  
(あーどっこい)
きつく抱かれて  また騙される  
(よっさいこーら×3はい)
祭り愛する  団長の顔  
団扇片手に  振り上げる振り上げる  
飲むっきゃないね  
(はいはいはい)
想いを繋ぐ  
(あーよっさいこーらはい)
村の宝が帰るまで  
(あーよっさい×3こーら)
飲むっきゃないね  
(はいはいはい)
はしゃいでみせる  
(あーよっさいこーらはい)
酔いどれ騒ぎの  秋祭り
(よっさい×3こーら)×2

2ちょっとぐらいは良いとこが  
あるの知ってるあたしだけ  
好いた祭りは命がけ  
祭りバカだと  言われてみても  
男貫く  想いをずっと  
秋の夜空に  響かせる響かせる  
飲むっきゃないね  
じゃんじゃん飲んで  
老いも若きも  声を出せ  
飲むっきゃないね  
歌えや踊れ  祭りだ騒げよ  秋祭り

3.河内男に惚れちゃった  
祭り3日の晴れ姿  
魅せる姿につけこまれ  
馬鹿を見るよと言われてみても  
この日夢見た  少年からよ  
苦労の日々を  
乗り越える  乗り越える  
飲むっきゃないね  
祭りに生きる
感謝  感謝を  忘れずに  
飲むっきゃないね  
歌えや踊れ  祭りだ騒げよ  秋祭り`
      },


      // --- 2026年唄 ---
      {
        category: "2026",
        title: "サンプル2026年唄",
        subtitle: "2026年度版のタイトル",
        lyrics: `（ここに2026年の歌詞を入力してください）`
      },

      // --- 三拍子 ---
      {
        category: "sanbyoshi",
        title: "サンプル三拍子",
        subtitle: "三拍子の楽曲",
        lyrics: `（ここに三拍子の歌詞を入力してください）`
      }
    ];

    // カテゴリ表示用のラベル定義
    const categoryNames = {
      "kazoe": "数え唄 一覧",
      "2025": "2025年 唄一覧",
      "2026": "2026年 唄一覧",
      "sanbyoshi": "三拍子 一覧"
    };

    // リストの描画処理
    function renderList(category) {
      const container = document.getElementById('song-container');
      container.innerHTML = ''; // 画面をクリア

      // タイトル見出しを更新
      document.getElementById('page-title').innerText = categoryNames[category] || "唄一覧";

      // 選択したカテゴリの曲のみ抽出＆タイトル順ソート
      const filteredSongs = songs
        .filter(song => song.category === category)
        .sort((a, b) => a.title.localeCompare(b.title, 'ja'));

      // 一覧要素を追加
      filteredSongs.forEach(song => {
        const li = document.createElement('li');
        li.className = 'song-item';
        li.onclick = () => showDetail(song);
        li.innerHTML = `
          <div class="song-title">${song.title}</div>
          <div class="song-subtitle">${song.subtitle}</div>
        `;
        container.appendChild(li);
      });
    }

    // カテゴリ切り替え時イベント
    function changeCategory() {
      const selectedCategory = document.getElementById('category-select').value;
      renderList(selectedCategory);
    }

    // 詳細画面の表示
    function showDetail(song) {
      document.getElementById('list-view').classList.add('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      document.getElementById('detail-title').innerText = song.title;
      document.getElementById('detail-subtitle').innerText = song.subtitle;
      document.getElementById('detail-lyrics').innerText = song.lyrics;
      window.scrollTo(0, 0);
    }

    // 一覧画面に戻る
    function showList() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('list-view').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    // 初期表示（デフォルトで「数え唄」を表示）
    renderList('kazoe');
  </script>
</body>
</html>
