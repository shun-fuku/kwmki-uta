<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唄一覧</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 22px; margin-bottom: 16px; border-bottom: 2px solid #333; padding-bottom: 8px; }
    
    /* 唄選択ドロップダウンのスタイル */
    .selector-container {
      margin-bottom: 20px;
    }
    .category-select {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      background-color: #21262d;
      color: #ffffff;
      border: 1px solid #30363d;
      border-radius: 6px;
      outline: none;
    }
    .category-select:focus {
      border-color: #58a6ff;
    }

    .song-list { list-style: none; padding: 0; margin: 0; }
    .song-item {
      padding: 14px;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
    }
    .song-item:active { background-color: #222; }
    .song-title { font-size: 18px; font-weight: bold; color: #58a6ff; }
    .song-subtitle { font-size: 13px; color: #8b949e; margin-top: 4px; }
    
    /* サブタイトル内リンク用のスタイリング */
    .link-badge {
      display: inline-block;
      color: #58a6ff;
      text-decoration: underline;
      margin-left: 4px;
    }

    .back-button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #58a6ff;
      font-size: 15px;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .lyrics { font-size: 17px; line-height: 1.8; white-space: pre-wrap; margin-top: 16px; }
    .hidden { display: none; }
  </style>
</head>

        { num: "27.", songId: "" },
        { num: "28.", songId: "" },
        { num: "29.", songId: "" },
        { num: "30.", songId: "" },
        { num: "31.", songId: "" },
        { num: "32.", songId: "" },
        { num: "33.", songId: "" },
        { num: "34.", songId: "" },
        { num: "35.", songId: "" },
        { num: "36.", songId: "" },
        { num: "37.", songId: "" },
        { num: "38.", songId: "" },
      ],
      "sanbyoshi": [
        { songId: "sanbyoshi_sample" }
      ]
    };

    // カテゴリ表示用のラベル定義
    const categoryNames = {
      "kazoe": "数え唄 一覧",
      "2025": "2025年 唄一覧",
      "2026": "2026年 唄一覧",
      "sanbyoshi": "三拍子 一覧"
    };

    // リストの描画処理
    function renderList(category) {
      const container = document.getElementById('song-container');
      container.innerHTML = ''; // 画面をクリア

      // タイトル見出しを更新
      document.getElementById('page-title').innerText = categoryNames[category] || "唄一覧";

      // 選択したカテゴリのリストを取得
      const playlist = playlists[category] || [];

      // 一覧要素を追加
      playlist.forEach(item => {
        const master = masterSongs[item.songId];
        if (!master) return; // データが存在しない場合はスキップ

        // 番号 + タイトル の表示形式を作る（番号指定がなければタイトルのみ）
        const displayTitle = item.num ? `${item.num} ${master.title}` : master.title;
        // 年度別サブタイトルがあればそちらを優先、なければマスターのサブタイトル
        const displaySubtitle = item.subtitle !== undefined ? item.subtitle : master.subtitle;

        const li = document.createElement('li');
        li.className = 'song-item';
        // クリック時に渡すデータを生成
        const songData = {
          title: displayTitle,
          subtitle: displaySubtitle,
          lyrics: master.lyrics
        };
        
        li.onclick = () => showDetail(songData);
        li.innerHTML = `
          <div class="song-title">${displayTitle}</div>
          <div class="song-subtitle">${displaySubtitle}</div>
        `;
        container.appendChild(li);
      });
    }

    // カテゴリ切り替え時イベント
    function changeCategory() {
      const selectedCategory = document.getElementById('category-select').value;
      renderList(selectedCategory);
    }

    // ★指定したカテゴリの最初の曲の詳細画面へ即座にジャンプする関数★
    function jumpToCategory(categoryKey) {
      const selectElem = document.getElementById('category-select');
      selectElem.value = categoryKey;
      renderList(categoryKey);

      const playlist = playlists[categoryKey];
      if (playlist && playlist.length > 0) {
        const firstItem = playlist[0];
        const master = masterSongs[firstItem.songId];
        if (master) {
          const displayTitle = firstItem.num ? `${firstItem.num} ${master.title}` : master.title;
          const displaySubtitle = firstItem.subtitle !== undefined ? firstItem.subtitle : master.subtitle;
          showDetail({
            title: displayTitle,
            subtitle: displaySubtitle,
            lyrics: master.lyrics
          });
        }
      }
    }

    // 詳細画面の表示
    function showDetail(song) {
      document.getElementById('list-view').classList.add('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      document.getElementById('detail-title').innerText = song.title;
      document.getElementById('detail-subtitle').innerHTML = song.subtitle;
      document.getElementById('detail-lyrics').innerText = song.lyrics;
      window.scrollTo(0, 0);
    }

    // 一覧画面に戻る
    function showList() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('list-view').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    // 初期表示（デフォルトで「数え唄」を表示）
    renderList('kazoe');
  </script>
</body>
</html>
