<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>唄一覧</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 22px; margin-bottom: 16px; border-bottom: 2px solid #333; padding-bottom: 8px; }
    
    /* 唄選択ドロップダウンのスタイル */
    .selector-container {
      margin-bottom: 20px;
    }
    .category-select {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      background-color: #21262d;
      color: #ffffff;
      border: 1px solid #30363d;
      border-radius: 6px;
      outline: none;
    }
    .category-select:focus {
      border-color: #58a6ff;
    }

    .song-list { list-style: none; padding: 0; margin: 0; }
    .song-item {
      padding: 14px;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
    }
    .song-item:active { background-color: #222; }
    .song-title { font-size: 18px; font-weight: bold; color: #58a6ff; }
    .song-subtitle { font-size: 13px; color: #8b949e; margin-top: 4px; }
    
    /* サブタイトル内リンク用のスタイリング */
    .link-badge {
      display: inline-block;
      color: #58a6ff;
      text-decoration: underline;
      margin-left: 4px;
    }

    .back-button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #58a6ff;
      font-size: 15px;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .lyrics { font-size: 17px; line-height: 1.8; white-space: pre-wrap; margin-top: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="list-view">
    <h1 id="page-title">数え唄</h1>
    
    <!-- 唄選択メニュー -->
    <div class="selector-container">
      <select id="category-select" class="category-select" onchange="changeCategory()">
        <option value="kazoe">数え唄</option>
        <option value="2025">2025年唄</option>
        <option value="2026">2026年唄</option>
        <option value="sanbyoshi">三拍子</option>
      </select>
    </div>

    <ul class="song-list" id="song-container"></ul>
  </div>

  <div id="detail-view" class="hidden">
    <button class="back-button" onclick="showList()">＜ 唄一覧に戻る</button>
    <h1 id="detail-title"></h1>
    <div id="detail-subtitle" style="color: #8b949e; margin-top: -10px; margin-bottom: 16px;"></div>
    <div class="lyrics" id="detail-lyrics"></div>
  </div>

  <script>
    // ==========================================
    // 1. 楽曲マスターデータ（歌詞・デフォルト情報を一括管理）
    // ==========================================
    const masterSongs = {
      "kazoe": {
        title: "数え唄",
        subtitle: " ",
        lyrics: `一節心を込めまして  
唄ってみましょう数え歌

二親ばかりか兄弟も  
あの日を限りに捨てました

短い命を惜しみなく  
生きたいように生きて死ぬ

宜しく頼むと死んでった  
兄貴の顔が目に浮かぶ

いろはにほへとの理屈より  
身体を張りましょ男なら

虫けら呼ばわりされたって  
辞められません秋祭り

涙を噛んでる忍んでる
堪忍袋は誰が切る

やる時ゃ真っ先おれがやる  
その後の責めもおれが負う

今夜も星降れ涙降れ  
恋しや河内の秋祭り
とうとうここまで数え唄  
その名も〇〇数え唄
        （番長）`
      },
      "nomukkyanaine": {
        title: "飲むっきゃないね",
        subtitle: "神社–歌い回し",
        lyrics: `1.祭り男につかまった  
(あーどっこい)
嘘はとっくにお見通し  
(あーどっこい)
祭りバカだと  叩いても  
(あーどっこい)
きつく抱かれて  また騙される  
(よっさいこーら×3はい)
祭り愛する  団長の顔  
団扇片手に  振り上げる振り上げる  
飲むっきゃないね  
(はいはいはい)
想いを繋ぐ  
(あーよっさいこーらはい)
村の宝が帰るまで  
(あーよっさい×3こーら)
飲むっきゃないね  
(はいはいはい)
はしゃいでみせる  
(あーよっさいこーらはい)
酔いどれ騒ぎの  秋祭り
(よっさい×3こーら)×2

2ちょっとぐらいは良いとこが  
あるの知ってるあたしだけ  
好いた祭りは命がけ  
祭りバカだと  言われてみても  
男貫く  想いをずっと  
秋の夜空に  響かせる響かせる  
飲むっきゃないね  
じゃんじゃん飲んで  
老いも若きも  声を出せ  
飲むっきゃないね  
歌えや踊れ  祭りだ騒げよ  秋祭り

3.河内男に惚れちゃった  
祭り3日の晴れ姿  
魅せる姿につけこまれ  
馬鹿を見るよと言われてみても  
この日夢見た  少年からよ  
苦労の日々を  
乗り越える  乗り越える  
飲むっきゃないね  
祭りに生きる
感謝  感謝を  忘れずに  
飲むっきゃないね  
歌えや踊れ  祭りだ騒げよ  秋祭り`
      },
      
      "aoikajitsu": {
        title: "青い果実",
        subtitle: "▶ <span class='link-badge' onclick='event.stopPropagation(); jumpToCategory(\"kazoe\")'>数え唄へ移動</span>",
        lyrics: `一節心を
  あーどっこい
込めまして
  あーどっこい
唄ってみましょう数え唄
  よっさい×3こーりゃ
二親ばかりか
  あーどっこい
兄弟も
  あーどっこい
あの日を限り捨てました
  よっさい×3こーりゃ
大阪狭山 
  はいはい
川向の
  あーよっさいこーりゃはい
だんじり秋祭り
  （よっさい×3こーりゃ）×2
短い命を惜しみなく惜しみなく
  あーどっこい
生きたいように生きて
      よっさいこーりゃしょい/
生きて死ぬ
  （よっさい×3こーりゃ）×2しょい`
      },
      "aoidiamond": {
        title: "青いダイヤモンド",
        subtitle: " ",
        lyrics: `涙が流れてとまらない
       よっさい×3こーりゃ×2
明日がどこかもわからない
       よっさい×3こーりゃ×2
（略）`
      },
      "akaituki": {
        title: "赤い満月",
        subtitle: " ",
        lyrics: `夜空に浮かんだ朧月（おぼろづき）
        あーどっこい
男の心に 火を灯す
（略）`
      },
      "sanbyoshi_sample": {
        title: "サンプル三拍子",
        subtitle: "三拍子の楽曲",
        lyrics: `（ここに三拍子の歌詞を入力してください）`
      }
    };

    // ==========================================
    // 2. 年度・カテゴリごとの曲順（プレイリスト）設定
    // ==========================================
    // songId: masterSongsのキーを指定
    // num: その年での番号（例: "1.", "2a." など）
    // subtitle: その年限定でサブタイトルを変えたい場合に指定（省略するとマスターの設定を使用）
    const playlists = {
      "kazoe": [
        { songId: "kazoe" }
      ],
      "2025": [
        { num: "0.", songId: "nomukkyanaine" },
        { num: "1.", songId: "aoikajitsu" },
        { num: "2.", songId: "aoidiamond" },
        { num: "3.", songId: "akaituki" }
      ],
      "2026": [
        // 2026年でも「青い果実」や「赤い満月」を再利用！
        { num: "1a.", songId: "aoi_kajitsu" },
        { num: "2a.", songId: "akai_mangetsu" },
        { num: "3b.", songId: "nomukkyanai", subtitle: "2026年特別アレンジ" } // 2026年だけサブタイトルを変える例
      ],
      "sanbyoshi": [
        { songId: "sanbyoshi_sample" }
      ]
    };

    // カテゴリ表示用のラベル定義
    const categoryNames = {
      "kazoe": "数え唄 一覧",
      "2025": "2025年 唄一覧",
      "2026": "2026年 唄一覧",
      "sanbyoshi": "三拍子 一覧"
    };

    // リストの描画処理
    function renderList(category) {
      const container = document.getElementById('song-container');
      container.innerHTML = ''; // 画面をクリア

      // タイトル見出しを更新
      document.getElementById('page-title').innerText = categoryNames[category] || "唄一覧";

      // 選択したカテゴリのリストを取得
      const playlist = playlists[category] || [];

      // 一覧要素を追加
      playlist.forEach(item => {
        const master = masterSongs[item.songId];
        if (!master) return; // データが存在しない場合はスキップ

        // 番号 + タイトル の表示形式を作る（番号指定がなければタイトルのみ）
        const displayTitle = item.num ? `${item.num} ${master.title}` : master.title;
        // 年度別サブタイトルがあればそちらを優先、なければマスターのサブタイトル
        const displaySubtitle = item.subtitle !== undefined ? item.subtitle : master.subtitle;

        const li = document.createElement('li');
        li.className = 'song-item';
        // クリック時に渡すデータを生成
        const songData = {
          title: displayTitle,
          subtitle: displaySubtitle,
          lyrics: master.lyrics
        };
        
        li.onclick = () => showDetail(songData);
        li.innerHTML = `
          <div class="song-title">${displayTitle}</div>
          <div class="song-subtitle">${displaySubtitle}</div>
        `;
        container.appendChild(li);
      });
    }

    // カテゴリ切り替え時イベント
    function changeCategory() {
      const selectedCategory = document.getElementById('category-select').value;
      renderList(selectedCategory);
    }

    // ★指定したカテゴリの最初の曲の詳細画面へ即座にジャンプする関数★
    function jumpToCategory(categoryKey) {
      const selectElem = document.getElementById('category-select');
      selectElem.value = categoryKey;
      renderList(categoryKey);

      const playlist = playlists[categoryKey];
      if (playlist && playlist.length > 0) {
        const firstItem = playlist[0];
        const master = masterSongs[firstItem.songId];
        if (master) {
          const displayTitle = firstItem.num ? `${firstItem.num} ${master.title}` : master.title;
          const displaySubtitle = firstItem.subtitle !== undefined ? firstItem.subtitle : master.subtitle;
          showDetail({
            title: displayTitle,
            subtitle: displaySubtitle,
            lyrics: master.lyrics
          });
        }
      }
    }

    // 詳細画面の表示
    function showDetail(song) {
      document.getElementById('list-view').classList.add('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      document.getElementById('detail-title').innerText = song.title;
      document.getElementById('detail-subtitle').innerHTML = song.subtitle;
      document.getElementById('detail-lyrics').innerText = song.lyrics;
      window.scrollTo(0, 0);
    }

    // 一覧画面に戻る
    function showList() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('list-view').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    // 初期表示（デフォルトで「数え唄」を表示）
    renderList('kazoe');
  </script>
</body>
</html>
